services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: commerce-flow-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping

      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    container_name: commerce-flow-postgres

    environment:
      POSTGRES_DB: commerce_flow
      POSTGRES_USER: commerce_flow
      POSTGRES_PASSWORD: commerce_flow

    ports:
      - "5432:5432"

    volumes:
      - commerce-flow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U commerce_flow -d commerce_flow

      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  commerce-flow-postgres-data:
