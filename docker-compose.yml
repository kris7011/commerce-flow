services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: commerce-flow-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping

      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s