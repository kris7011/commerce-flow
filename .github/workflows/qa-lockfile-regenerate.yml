name: QA lockfile regeneration (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'qa/cross-platform-20261101' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate the lockfile using the patched dependency override
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify the regenerated lockfile is installable
        run: npm ci
      - name: Security audit must remain clean
        run: npm audit --audit-level=moderate
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Save lockfile changes to QA branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): lock patched minimatch dependency"
          git push origin "HEAD:qa/cross-platform-20261101"
