name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Node.js ${{ matrix.node-version }}
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                # Supported Node.js LTS lines (Node.js 20 reached
                # end-of-life in April 2026).
                node-version:
                    - 22.x
                    - 24.x

        env:
            CI: true
            RABBITMQ_URL: amqp://guest:guest@localhost:5672
            RABBITMQ_MANAGEMENT_URL: http://guest:guest@localhost:15672
            TEST_DATABASE_ADMIN_URL: postgresql://commerce_flow:commerce_flow@localhost:5432/postgres

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=moderate

            - name: Lint
              run: npm run lint

            - name: Type-check project
              run: npm run typecheck

            - name: Build workspaces
              run: npm run build

            - name: Run unit tests
              run: npm test

            # Start the containers while nothing else needs them yet;
            # --wait blocks until the health checks pass.
            - name: Start PostgreSQL and RabbitMQ
              run: docker compose up -d --wait rabbitmq postgres

            - name: Run integration tests (PostgreSQL and RabbitMQ)
              run: npm run test:integration

            - name: Run end-to-end and recovery tests
              run: npm run test:e2e

            - name: Show infrastructure logs on failure
              if: failure()
              run: docker compose logs --no-color --tail=200

            - name: Stop infrastructure
              if: always()
              run: docker compose down --volumes

    # Builds the service image and runs the whole system the way a
    # reviewer would locally: five containers plus RabbitMQ and
    # PostgreSQL, then the scripted order-flow demo against them.
    full-stack:
        name: Full-stack demo (containers)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        env:
            DEMO_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build and start all services as containers
              run: docker compose --profile app up -d --build --wait --wait-timeout 180

            - name: Show the service image
              run: docker image ls commerce-flow-service:local

            - name: Run the order-flow demo
              run: npm run demo

            - name: Show system status
              run: npm run status

            - name: Trace the demo order through all service logs
              run: |
                  docker compose --profile app logs --no-log-prefix --no-color \
                      | npm run --silent trace -- "demo-${DEMO_RUN_ID}-success"

            - name: Show container logs on failure
              if: failure()
              run: docker compose --profile app logs --no-color --tail=300

            - name: Stop the stack
              if: always()
              run: docker compose --profile app down --volumes
